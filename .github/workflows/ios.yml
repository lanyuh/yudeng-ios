name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 xcodegen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project Yudeng.xcodeproj \
            -scheme Yudeng \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打成 ipa
        run: |
          mkdir -p out/Payload
          cp -r build/Build/Products/Release-iphoneos/Yudeng.app out/Payload/
          cd out && zip -r Yudeng-unsigned.ipa Payload

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: Yudeng-unsigned-ipa
          path: out/Yudeng-unsigned.ipa
          if-no-files-found: error
